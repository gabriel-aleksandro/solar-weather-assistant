services:
  - type: web
    name: solar-weather-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GROQ_API_KEY
        sync: false        # definido manualmente no dashboard do Render
      - key: HF_TOKEN
        sync: false        # token gratuito em hf.co/settings/tokens
    autoDeploy: true
